services:
  postgres:
    image: postgres:16-alpine
    container_name: torneos_esports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-torneos_esports}"
    ports:
      # Exponer solo en la interfaz de loopback local (127.0.0.1) para evitar exposición en red local
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Uso de variables internas del contenedor ($$) sin exponer credenciales
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
